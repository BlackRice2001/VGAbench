<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VGA-Bench | Leaderboard</title>
  <style>
    :root {
      --bg: #ececec;
      --panel: #f5f5f5;
      --row: #e9eaeb;
      --row-alt: #e4e5e7;
      --text: #243242;
      --muted: #6b7683;
      --teal: #2f9b97;
      --teal-soft: #cfdee2;
      --blue: #477ac3;
      --blue-soft: #d2dbe8;
      --orange: #de8541;
      --orange-soft: #eadcd1;
      --shadow: 0 8px 22px rgba(35, 50, 66, 0.06);
      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 34px 34px 42px;
    }

    .header {
      background: rgba(255,255,255,0.38);
      border: 1px solid rgba(255,255,255,0.45);
      border-radius: 26px;
      padding: 26px 30px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
      backdrop-filter: blur(4px);
    }

    .brand {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .subline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .paper-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .paper-links a,
    .resource-card a {
      text-decoration: none;
    }

    .pill-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 999px;
      background: #ffffff;
      color: var(--text);
      border: 1px solid #e1e5ea;
      font-weight: 700;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.03);
    }

    .pill-link:hover,
    .resource-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(35, 50, 66, 0.08);
    }

    .section-card {
      background: rgba(255,255,255,0.28);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .section-title {
      margin: 0 0 20px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .leaderboard-wrap {
      overflow-x: auto;
    }

    .leaderboard {
      min-width: 1180px;
    }

    .leaderboard-head,
    .leaderboard-row {
      display: grid;
      grid-template-columns: 260px repeat(3, minmax(260px, 1fr));
      column-gap: 24px;
      align-items: center;
    }

    .leaderboard-head {
      margin-bottom: 18px;
      padding: 0 18px;
    }

    .head-model {
      font-size: 1.08rem;
      font-weight: 800;
      color: #2b4060;
    }

    .metric-head {
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 0.96rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .metric-head:hover { opacity: 0.95; }
    .metric-head:active { transform: translateY(1px); }

    .metric-head.teal { background: var(--teal); }
    .metric-head.blue { background: var(--blue); }
    .metric-head.orange { background: var(--orange); }

    .leaderboard-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-row {
      background: rgba(255,255,255,0.17);
      border-radius: 16px;
      padding: 13px 18px;
    }

    .leaderboard-row:nth-child(even) {
      background: rgba(255,255,255,0.3);
    }

    .model-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: #22303d;
    }

    .metric-cell {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .bar-track {
      position: relative;
      flex: 1 1 auto;
      height: 18px;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      height: 100%;
      border-radius: inherit;
    }

    .metric-cell.teal .bar-track { background: var(--teal-soft); }
    .metric-cell.teal .bar-fill { background: var(--teal); }
    .metric-cell.blue .bar-track { background: var(--blue-soft); }
    .metric-cell.blue .bar-fill { background: var(--blue); }
    .metric-cell.orange .bar-track { background: var(--orange-soft); }
    .metric-cell.orange .bar-fill { background: var(--orange); }

    .score {
      width: 64px;
      text-align: right;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      color: #233242;
    }

    .score.best {
      font-weight: 800;
    }

    .score.second {
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
    }

    .score.teal.best, .score.teal.second { color: var(--teal); }
    .score.blue.best, .score.blue.second { color: var(--blue); }
    .score.orange.best, .score.orange.second { color: var(--orange); }

    .resources-section {
      margin-top: 26px;
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 20px;
    }

    .resource-card {
      display: block;
      background: rgba(255,255,255,0.45);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 22px;
      padding: 22px 24px;
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .resource-label {
      display: inline-block;
      margin-bottom: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .resource-card.github .resource-label {
      background: rgba(71,122,195,0.12);
      color: var(--blue);
    }

    .resource-card.dataset .resource-label {
      background: rgba(47,155,151,0.12);
      color: var(--teal);
    }

    .resource-title {
      margin: 0 0 8px;
      font-size: 1.14rem;
      font-weight: 800;
      color: var(--text);
    }

    .resource-desc {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      word-break: break-word;
    }

    .footer-note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 1100px) {
      .page { padding: 20px; }
      .resources-section { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .header { padding: 22px 18px; }
      .section-card { padding: 20px 16px; }
      h1 { font-size: 1.6rem; }
      .brand { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="brand">
        <div>
          <h1>VGA-Bench</h1>
          <div class="subline">Leaderboard · Papers · Toolkit · Dataset</div>
        </div>
        <div class="paper-links">
          <a class="pill-link" href="https://arxiv.org/abs/2604.10127" target="_blank" rel="noopener noreferrer">📄 arXiv 2604.10127</a>
          <a class="pill-link" href="https://arxiv.org/abs/2608.25452" target="_blank" rel="noopener noreferrer">📄 arXiv 2608.25452</a>
        </div>
      </div>
    </header>

    <main class="section-card">
      <h2 class="section-title">Leaderboard</h2>
      <div class="leaderboard-wrap">
        <div class="leaderboard" id="leaderboard">
          <div class="leaderboard-head">
            <div class="head-model">模型</div>
            <button class="metric-head teal" data-sort="aes">Aes. Score</button>
            <button class="metric-head blue" data-sort="tag">Tag Cla.</button>
            <button class="metric-head orange" data-sort="gen">Gen. Level</button>
          </div>
          <div class="leaderboard-body" id="leaderboard-body"></div>
        </div>
      </div>

      <div class="resources-section">
        <a class="resource-card github" href="https://github.com/BestiVictory/VGA-Bench" target="_blank" rel="noopener noreferrer">
          <div class="resource-label">Toolkit</div>
          <h3 class="resource-title">Code &amp; Evaluation Toolkit</h3>
          <p class="resource-desc">https://github.com/BestiVictory/VGA-Bench</p>
        </a>
        <a class="resource-card dataset" href="https://huggingface.co/datasets/BestiVictoryLab/VGA-Bench" target="_blank" rel="noopener noreferrer">
          <div class="resource-label">Dataset</div>
          <h3 class="resource-title">Hugging Face Dataset</h3>
          <p class="resource-desc">https://huggingface.co/datasets/BestiVictoryLab/VGA-Bench</p>
        </a>
      </div>
    </main>
  </div>

  <script>
    const rows = [
      { model: 'SVD', aes: 0.20, tag: 0.60, gen: 0.69 },
      { model: 'AnimateDiff', aes: 0.36, tag: 0.57, gen: 0.67 },
      { model: 'LaVie', aes: 0.34, tag: 0.58, gen: 0.68 },
      { model: 'Show-1', aes: 0.29, tag: 0.60, gen: 0.04 },
      { model: 'ModelScope', aes: 0.31, tag: 0.51, gen: 0.64 },
      { model: 'CogVideoX', aes: 0.41, tag: 0.56, gen: 0.70 },
      { model: 'Latte-1', aes: 0.35, tag: 0.60, gen: 0.68 },
      { model: 'Mochi', aes: 0.21, tag: 0.68, gen: 0.71 },
      { model: 'LTXVideo', aes: 0.22, tag: 0.61, gen: 0.61 },
      { model: 'HunyuanVideo', aes: 0.45, tag: 0.66, gen: 0.73 },
      { model: 'Wan2.2', aes: 0.46, tag: 0.63, gen: 0.71 },
      { model: 'Sora2', aes: 0.50, tag: 0.64, gen: 0.80 }
    ];

    const metrics = [
      { key: 'aes', className: 'teal' },
      { key: 'tag', className: 'blue' },
      { key: 'gen', className: 'orange' }
    ];

    const state = {
      sortKey: null,
      descending: true
    };

    function getRanks(key) {
      const values = [...new Set(rows.map(item => item[key]))].sort((a, b) => b - a);
      return {
        best: values[0],
        second: values[1]
      };
    }

    function createMetricCell(value, key, className) {
      const max = Math.max(...rows.map(item => item[key]));
      const min = Math.min(...rows.map(item => item[key]));
      const normalized = max === min ? 100 : ((value - min) / (max - min)) * 100;
      const ranks = getRanks(key);

      let rankClass = '';
      if (value === ranks.best) rankClass = 'best';
      else if (value === ranks.second) rankClass = 'second';

      return `
        <div class="metric-cell ${className}">
          <div class="bar-track">
            <div class="bar-fill" style="width: ${Math.max(normalized, value > 0 ? 4 : 0)}%;"></div>
          </div>
          <div class="score ${className} ${rankClass}">${value.toFixed(2)}</div>
        </div>
      `;
    }

    function renderLeaderboard() {
      const body = document.getElementById('leaderboard-body');
      let data = [...rows];

      if (state.sortKey) {
        if (state.sortKey === 'model') {
          data.sort((a, b) => state.descending
            ? b.model.localeCompare(a.model)
            : a.model.localeCompare(b.model));
        } else {
          data.sort((a, b) => state.descending
            ? b[state.sortKey] - a[state.sortKey]
            : a[state.sortKey] - b[state.sortKey]);
        }
      }

      body.innerHTML = data.map(item => `
        <div class="leaderboard-row">
          <div class="model-name">${item.model}</div>
          ${createMetricCell(item.aes, 'aes', 'teal')}
          ${createMetricCell(item.tag, 'tag', 'blue')}
          ${createMetricCell(item.gen, 'gen', 'orange')}
        </div>
      `).join('');
    }

    document.querySelectorAll('[data-sort]').forEach(button => {
      button.addEventListener('click', () => {
        const key = button.dataset.sort;
        if (state.sortKey === key) {
          state.descending = !state.descending;
        } else {
          state.sortKey = key;
          state.descending = true;
        }
        renderLeaderboard();
      });
    });

    renderLeaderboard();
  </script>

</body>
</html>
