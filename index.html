<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VGA-Bench | Leaderboard</title>

  <style>
    :root {
      --bg: #ececec;
      --panel: #f5f5f5;
      --row: #e9eaeb;
      --row-alt: #e4e5e7;

      --text: #243242;
      --muted: #6b7683;

      --teal: #2f9b97;
      --teal-soft: #cfdee2;

      --blue: #477ac3;
      --blue-soft: #d2dbe8;

      --orange: #de8541;
      --orange-soft: #eadcd1;

      --shadow: 0 8px 22px rgba(35, 50, 66, 0.06);

      --radius-xl: 22px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;
    }

    .page {
      max-width: 1600px;
      margin: 0 auto;
      padding: 34px 34px 42px;
    }

    /* =========================
       Header
       ========================= */

    .header {
      background: rgba(255, 255, 255, 0.38);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 26px;
      padding: 26px 30px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
      backdrop-filter: blur(4px);
    }

    .brand {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .subline {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    .paper-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .paper-links a,
    .resource-card a {
      text-decoration: none;
    }

    .pill-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 11px 16px;

      border-radius: 999px;
      background: #ffffff;
      color: var(--text);

      border: 1px solid #e1e5ea;

      font-weight: 700;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.03);
    }

    .pill-link:hover,
    .resource-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(35, 50, 66, 0.08);
    }

    /* =========================
       Main card
       ========================= */

    .section-card {
      background: rgba(255, 255, 255, 0.28);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .section-title {
      margin: 0 0 20px;

      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    /* =========================
       Leaderboard
       ========================= */

    .leaderboard-wrap {
      overflow-x: auto;
    }

    .leaderboard {
      min-width: 1180px;
    }

    .leaderboard-head,
    .leaderboard-row {
      display: grid;

      grid-template-columns:
        260px
        repeat(3, minmax(260px, 1fr));

      column-gap: 24px;

      align-items: center;
    }

    .leaderboard-head {
      margin-bottom: 18px;
      padding: 0 18px;
    }

    .head-model {
      font-size: 1.08rem;
      font-weight: 800;
      color: #2b4060;
    }

    /* =========================
       Sortable metric headers
       ========================= */

    .metric-head {
      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;

      border: none;
      border-radius: 14px;

      padding: 14px 16px;

      font-size: 0.96rem;
      font-weight: 800;
      font-family: inherit;

      text-align: center;
      letter-spacing: 0.01em;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .metric-head:hover {
      opacity: 0.94;
      box-shadow: 0 5px 12px rgba(35, 50, 66, 0.12);
    }

    .metric-head:active {
      transform: translateY(1px);
    }

    .metric-head.teal {
      background: var(--teal);
    }

    .metric-head.blue {
      background: var(--blue);
    }

    .metric-head.orange {
      background: var(--orange);
    }

    /*
      ↑↓ 排序提示
    */
    .sort-icon {
      display: inline-block;

      margin-left: 8px;

      font-size: 0.9em;
      font-weight: 800;

      opacity: 0.72;

      min-width: 20px;

      text-align: center;
      line-height: 1;
    }

    /*
      当前正在排序的列，
      箭头显示更明显。
    */
    .metric-head.active .sort-icon {
      opacity: 1;
      transform: scale(1.08);
    }

    /* =========================
       Leaderboard rows
       ========================= */

    .leaderboard-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .leaderboard-row {
      background: rgba(255, 255, 255, 0.17);

      border-radius: 16px;

      padding: 13px 18px;

      transition:
        background 0.18s ease,
        transform 0.18s ease;
    }

    .leaderboard-row:nth-child(even) {
      background: rgba(255, 255, 255, 0.30);
    }

    .leaderboard-row:hover {
      background: rgba(255, 255, 255, 0.48);
    }

    .model-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: #22303d;
    }

    /* =========================
       Metric cells
       ========================= */

    .metric-cell {
      display: flex;
      align-items: center;

      gap: 16px;

      min-width: 0;
    }

    .bar-track {
      position: relative;

      flex: 1 1 auto;

      height: 18px;

      border-radius: 999px;

      overflow: hidden;
    }

    .bar-fill {
      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      height: 100%;

      border-radius: inherit;

      transition: width 0.35s ease;
    }

    /* Aesthetic */
    .metric-cell.teal .bar-track {
      background: var(--teal-soft);
    }

    .metric-cell.teal .bar-fill {
      background: var(--teal);
    }

    /* Tag */
    .metric-cell.blue .bar-track {
      background: var(--blue-soft);
    }

    .metric-cell.blue .bar-fill {
      background: var(--blue);
    }

    /* Generation */
    .metric-cell.orange .bar-track {
      background: var(--orange-soft);
    }

    .metric-cell.orange .bar-fill {
      background: var(--orange);
    }

    /* =========================
       Scores
       ========================= */

    .score {
      width: 64px;

      text-align: right;

      font-size: 0.95rem;

      font-variant-numeric: tabular-nums;

      color: #233242;
    }

    /*
      每个指标最高分
    */
    .score.best {
      font-weight: 800;
    }

    /*
      每个指标第二高分
    */
    .score.second {
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 2px;
    }

    .score.teal.best,
    .score.teal.second {
      color: var(--teal);
    }

    .score.blue.best,
    .score.blue.second {
      color: var(--blue);
    }

    .score.orange.best,
    .score.orange.second {
      color: var(--orange);
    }

    /* =========================
       Resources
       ========================= */

    .resources-section {
      margin-top: 26px;

      display: grid;

      grid-template-columns:
        repeat(2, minmax(260px, 1fr));

      gap: 20px;
    }

    .resource-card {
      display: block;

      background: rgba(255, 255, 255, 0.45);

      border: 1px solid rgba(255, 255, 255, 0.50);
      border-radius: 22px;

      padding: 22px 24px;

      color: inherit;
      text-decoration: none;

      box-shadow: var(--shadow);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .resource-label {
      display: inline-block;

      margin-bottom: 10px;

      padding: 6px 10px;

      border-radius: 999px;

      font-size: 0.78rem;
      font-weight: 800;

      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .resource-card.github .resource-label {
      background: rgba(71, 122, 195, 0.12);
      color: var(--blue);
    }

    .resource-card.dataset .resource-label {
      background: rgba(47, 155, 151, 0.12);
      color: var(--teal);
    }

    .resource-title {
      margin: 0 0 8px;

      font-size: 1.14rem;
      font-weight: 800;

      color: var(--text);
    }

    .resource-desc {
      margin: 0;

      color: var(--muted);

      line-height: 1.55;

      word-break: break-word;
    }

    /* =========================
       Responsive
       ========================= */

    @media (max-width: 1100px) {
      .page {
        padding: 20px;
      }

      .resources-section {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .header {
        padding: 22px 18px;
      }

      .section-card {
        padding: 20px 16px;
      }

      h1 {
        font-size: 1.6rem;
      }

      .brand {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- =========================
         Header
         ========================= -->

    <header class="header">

      <div class="brand">

        <div>
          <h1>VGA-Bench</h1>

          <div class="subline">
            Leaderboard · Papers · Toolkit · Dataset
          </div>
        </div>

        <div class="paper-links">

          <a
            class="pill-link"
            href="https://arxiv.org/abs/2604.10127"
            target="_blank"
            rel="noopener noreferrer"
          >
            📄 arXiv 2604.10127
          </a>

          <a
            class="pill-link"
            href="https://arxiv.org/abs/2608.25452"
            target="_blank"
            rel="noopener noreferrer"
          >
            📄 arXiv 2608.25452
          </a>

        </div>

      </div>

    </header>


    <!-- =========================
         Main
         ========================= -->

    <main class="section-card">

      <h2 class="section-title">
        Leaderboard
      </h2>


      <!-- =========================
           Leaderboard
           ========================= -->

      <div class="leaderboard-wrap">

        <div
          class="leaderboard"
          id="leaderboard"
        >

          <!-- Header -->

          <div class="leaderboard-head">

            <div class="head-model">
              模型
            </div>

            <button
              class="metric-head teal"
              data-sort="aes"
              type="button"
              title="点击切换升序 / 降序"
              aria-label="按照 Aes. Score 排序"
            >
              <span>Aes. Score</span>
              <span class="sort-icon">↑↓</span>
            </button>

            <button
              class="metric-head blue"
              data-sort="tag"
              type="button"
              title="点击切换升序 / 降序"
              aria-label="按照 Tag Cla. 排序"
            >
              <span>Tag Cla.</span>
              <span class="sort-icon">↑↓</span>
            </button>

            <button
              class="metric-head orange"
              data-sort="gen"
              type="button"
              title="点击切换升序 / 降序"
              aria-label="按照 Gen. Level 排序"
            >
              <span>Gen. Level</span>
              <span class="sort-icon">↑↓</span>
            </button>

          </div>


          <!-- Rows -->

          <div
            class="leaderboard-body"
            id="leaderboard-body"
          ></div>

        </div>

      </div>


      <!-- =========================
           Resources
           ========================= -->

      <div class="resources-section">

        <a
          class="resource-card github"
          href="https://github.com/BestiVictory/VGA-Bench"
          target="_blank"
          rel="noopener noreferrer"
        >

          <div class="resource-label">
            Toolkit
          </div>

          <h3 class="resource-title">
            Code &amp; Evaluation Toolkit
          </h3>

          <p class="resource-desc">
            https://github.com/BestiVictory/VGA-Bench
          </p>

        </a>


        <a
          class="resource-card dataset"
          href="https://huggingface.co/datasets/BestiVictoryLab/VGA-Bench"
          target="_blank"
          rel="noopener noreferrer"
        >

          <div class="resource-label">
            Dataset
          </div>

          <h3 class="resource-title">
            Hugging Face Dataset
          </h3>

          <p class="resource-desc">
            https://huggingface.co/datasets/BestiVictoryLab/VGA-Bench
          </p>

        </a>

      </div>

    </main>

  </div>


  <script>

    /* =========================================
       Leaderboard Data
       ========================================= */

    const rows = [

      {
        model: 'SVD',
        aes: 0.20,
        tag: 0.60,
        gen: 0.69
      },

      {
        model: 'AnimateDiff',
        aes: 0.36,
        tag: 0.57,
        gen: 0.67
      },

      {
        model: 'LaVie',
        aes: 0.34,
        tag: 0.58,
        gen: 0.68
      },

      {
        model: 'Show-1',
        aes: 0.29,
        tag: 0.60,
        gen: 0.04
      },

      {
        model: 'ModelScope',
        aes: 0.31,
        tag: 0.51,
        gen: 0.64
      },

      {
        model: 'CogVideoX',
        aes: 0.41,
        tag: 0.56,
        gen: 0.70
      },

      {
        model: 'Latte-1',
        aes: 0.35,
        tag: 0.60,
        gen: 0.68
      },

      {
        model: 'Mochi',
        aes: 0.21,
        tag: 0.68,
        gen: 0.71
      },

      {
        model: 'LTXVideo',
        aes: 0.22,
        tag: 0.61,
        gen: 0.61
      },

      {
        model: 'HunyuanVideo',
        aes: 0.45,
        tag: 0.66,
        gen: 0.73
      },

      {
        model: 'Wan2.2',
        aes: 0.46,
        tag: 0.63,
        gen: 0.71
      },

      {
        model: 'Sora2',
        aes: 0.50,
        tag: 0.64,
        gen: 0.80
      }

    ];


    /* =========================================
       Sorting State
       ========================================= */

    const state = {

      /*
        null:
        页面首次打开时保持原始模型顺序
      */
      sortKey: null,

      /*
        第一次点击某个指标后，
        默认高分 -> 低分
      */
      descending: true

    };


    /* =========================================
       Get Best / Second Best
       ========================================= */

    function getRanks(key) {

      /*
        去重后按照从大到小排列。

        例如：
        [0.80, 0.73, 0.71, 0.71 ...]

        best   = 0.80
        second = 0.73

        如果两个模型并列 0.71，
        不会错误地把 0.71 同时认为第一和第二。
      */

      const values = [
        ...new Set(
          rows.map(item => item[key])
        )
      ].sort((a, b) => b - a);

      return {
        best: values[0],
        second: values[1]
      };

    }


    /* =========================================
       Create Metric Cell
       ========================================= */

    function createMetricCell(
      value,
      key,
      className
    ) {

      /*
        =========================================
        IMPORTANT
        =========================================

        这里不再按照当前所有模型的最大值 / 最小值归一化。

        统一使用固定的 0 ~ 1 比例：

        0.00 =   0%
        0.20 =  20%
        0.50 =  50%
        0.80 =  80%
        1.00 = 100%

        Math.max / Math.min 用于避免未来数据
        意外超过 0~1 时破坏进度条。
      */

      const safeValue = Math.max(
        0,
        Math.min(1, value)
      );

      const percentage =
        safeValue * 100;


      /*
        判断最高分和第二高分
      */

      const ranks =
        getRanks(key);

      let rankClass = '';

      if (value === ranks.best) {

        rankClass = 'best';

      } else if (value === ranks.second) {

        rankClass = 'second';

      }


      return `
        <div class="metric-cell ${className}">

          <div class="bar-track">

            <div
              class="bar-fill"
              style="width: ${percentage}%;"
            ></div>

          </div>

          <div
            class="score ${className} ${rankClass}"
          >
            ${value.toFixed(2)}
          </div>

        </div>
      `;

    }


    /* =========================================
       Render Leaderboard
       ========================================= */

    function renderLeaderboard() {

      const body =
        document.getElementById(
          'leaderboard-body'
        );

      /*
        复制数组，避免改变原数据
      */

      let data =
        [...rows];


      /*
        如果已经选择排序指标，
        对数据进行排序。
      */

      if (state.sortKey) {

        data.sort((a, b) => {

          if (state.descending) {

            /*
              降序：
              高分 -> 低分
            */

            return (
              b[state.sortKey] -
              a[state.sortKey]
            );

          } else {

            /*
              升序：
              低分 -> 高分
            */

            return (
              a[state.sortKey] -
              b[state.sortKey]
            );

          }

        });

      }


      /*
        生成所有模型行
      */

      body.innerHTML =
        data.map(item => `

          <div class="leaderboard-row">

            <div class="model-name">
              ${item.model}
            </div>

            ${createMetricCell(
              item.aes,
              'aes',
              'teal'
            )}

            ${createMetricCell(
              item.tag,
              'tag',
              'blue'
            )}

            ${createMetricCell(
              item.gen,
              'gen',
              'orange'
            )}

          </div>

        `).join('');

    }


    /* =========================================
       Update Sort Icons
       ========================================= */

    function updateSortIndicators() {

      const buttons =
        document.querySelectorAll(
          '[data-sort]'
        );

      buttons.forEach(button => {

        const key =
          button.dataset.sort;

        const icon =
          button.querySelector(
            '.sort-icon'
          );


        /*
          清除当前状态
        */

        button.classList.remove(
          'active'
        );


        /*
          当前正在排序的指标
        */

        if (
          state.sortKey === key
        ) {

          button.classList.add(
            'active'
          );


          /*
            ↓ = 从高到低
            ↑ = 从低到高
          */

          icon.textContent =
            state.descending
              ? '↓'
              : '↑';


          /*
            同时更新 tooltip
          */

          button.title =
            state.descending
              ? '当前：从高到低。点击切换为从低到高'
              : '当前：从低到高。点击切换为从高到低';

        }

        /*
          未选择的列显示 ↑↓
        */

        else {

          icon.textContent =
            '↑↓';

          button.title =
            '点击排序：首次点击按从高到低排列';

        }

      });

    }


    /* =========================================
       Sort Button Events
       ========================================= */

    document
      .querySelectorAll(
        '[data-sort]'
      )
      .forEach(button => {

        button.addEventListener(
          'click',
          () => {

            const key =
              button.dataset.sort;


            /*
              点击当前已经排序的指标：
              切换升序 / 降序
            */

            if (
              state.sortKey === key
            ) {

              state.descending =
                !state.descending;

            }

            /*
              点击新的指标：
              默认按降序排序
            */

            else {

              state.sortKey =
                key;

              state.descending =
                true;

            }


            /*
              重新绘制排行榜
            */

            renderLeaderboard();


            /*
              更新 ↑ ↓ 图标
            */

            updateSortIndicators();

          }
        );

      });


    /* =========================================
       Initial Render
       ========================================= */

    renderLeaderboard();

    updateSortIndicators();

  </script>

</body>
</html>
